## Managed component dependencies for the board-support package.
## `idf.py` (component manager) resolves and downloads these on the first build.
dependencies:
  idf: ">=6.0"
  # Left open-ended (just "9.x") rather than pinned to ~9.2.0: esp_lvgl_port
  # 2.9.0 uses LV_COLOR_FORMAT_RGB565_SWAPPED, which lvgl only added after
  # 9.2.x - a narrower pin here can resolve to an lvgl release too old for
  # whatever esp_lvgl_port version the solver picks.
  lvgl/lvgl: "^9.0.0"
  espressif/esp_lvgl_port: "^2.4.0"
  espressif/esp_lcd_touch_ft5x06: "^1.0.7"
  espressif/esp_lcd_st7796: "^1.2.0"
